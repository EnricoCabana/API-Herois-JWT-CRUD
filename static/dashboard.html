<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Universo Heróis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            padding: 2em;
        }

        .dashboard-container {
            background-color: #ffffff;
            padding: 3em;
            border-radius: 0.8em;
            box-shadow: 0 0.8em 2em rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .welcome-message {
            font-size: 1.5em;
            margin-bottom: 1.5em;
            color: #343a40;
        }

        .nav-links .list-group-item {
            font-size: 1.1em;
            padding: 0.8em 1.2em;
            transition: background-color 0.2s ease-in-out;
        }

        .nav-links .list-group-item:hover {
            background-color: #e9ecef;
        }

        .btn-logout {
            margin-top: 2.5em;
            width: 100%;
            max-width: 200px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <h1 class="mb-4">Universo Heróis - Dashboard</h1>

        <div id="divWelcomeMessage" class="alert alert-primary welcome-message"></div>

        <h3 class="mt-5 mb-3">Gerenciamento:</h3>
        <div class="list-group nav-links">
            <a href="Poderes.html" class="list-group-item list-group-item-action">Gerenciar Poderes</a>
            <a href="Herois.html" class="list-group-item list-group-item-action">Gerenciar Heróis</a>
            <a href="Viloes.html" class="list-group-item list-group-item-action">Gerenciar Vilões</a>
        </div>

        <button id="btnLogout" class="btn btn-danger btn-logout">Sair</button>
    </div>

    <script type="module">
        const divWelcomeMessage = document.getElementById("divWelcomeMessage");
        const btnLogout = document.getElementById("btnLogout");

        let userData = localStorage.getItem("userData");

        // Verifica se há dados de usuário no localStorage
        if (userData) {
            userData = JSON.parse(userData);

            const username = userData.user.username;
            const userRole = userData.user.role;

            divWelcomeMessage.textContent = `Bem Vindo, ${username}! (Cargo: ${userRole})`;

        } else {
            // Se não há dados de usuário, redireciona para a página de login
            window.location.href = "Login.html";
        }

        // Lógica para o botão de Logout
        btnLogout.addEventListener("click", () => {
            localStorage.removeItem("userData"); // Remove os dados do usuário
            window.location.href = "Login.html"; // Redireciona para a tela de login
        });
    </script>
</body>

</html>
